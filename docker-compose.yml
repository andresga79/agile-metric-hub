# json-file logs grow without bound by default (pino logs every request); cap them per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: agile_metrics_db
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agile_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agile_password}
      POSTGRES_DB: ${POSTGRES_DB:-agile_metrics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agile_user} -d ${POSTGRES_DB:-agile_metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily pg_dump with rotation (7 daily + 4 weekly) - see docker/backup/backup.sh. Point
  # BACKUP_DIR at a disk or mounted network share that isn't the same disk as the Docker volume,
  # otherwise a disk failure takes the backups with it.
  backup:
    image: postgres:16-alpine
    container_name: agile_metrics_backup
    logging: *default-logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-agile_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-agile_password}
      PGDATABASE: ${POSTGRES_DB:-agile_metrics}
      TZ: ${TZ:-America/Santiago}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: agile_metrics_api
    logging: *default-logging
    environment:
      # V8 old-space heap in MB. Measured peak ~290 MiB RSS on a cold-cache report load (OLI);
      # 1024 leaves headroom for bigger projects / 150-day sprint windows. Raise if the host allows.
      NODE_OPTIONS: "--max-old-space-size=${API_MAX_OLD_SPACE_MB:-1024}"
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-agile_user}:${POSTGRES_PASSWORD:-agile_password}@db:5432/${POSTGRES_DB:-agile_metrics}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # slim image has no curl; Node 22 has fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        SKIP_CODEGEN: '1'
    container_name: agile_metrics_web
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
