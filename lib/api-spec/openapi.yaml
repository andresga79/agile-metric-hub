openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Agile Metrics Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: admin
    description: Admin user management operations
  - name: projects
    description: Jira project operations
  - name: metrics
    description: Agile metrics operations
  - name: dashboard
    description: Dashboard summary operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all Jira projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/metrics/{period}:
    get:
      operationId: getProjectMetrics
      tags: [metrics]
      summary: Get KPI metrics for a project by period
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: ["1m", "3m", "2s", "6s"]
          description: >
            Time window. "1m"/"3m" = últimos 30/90 días (kanban, o scrum sin
            selector de sprint). "Ns" = últimos N sprints CERRADOS (solo
            scrum); si el proyecto no tiene sprints cerrados aún, cae a "1m".
      responses:
        "200":
          description: Project metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetrics"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/members/{period}:
    get:
      operationId: getProjectMembers
      tags: [metrics]
      summary: Get team member statistics for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: ["1m", "3m", "2s", "6s"]
          description: >
            Time window. "1m"/"3m" = últimos 30/90 días (kanban, o scrum sin
            selector de sprint). "Ns" = últimos N sprints CERRADOS (solo
            scrum); si el proyecto no tiene sprints cerrados aún, cae a "3m".
      responses:
        "200":
          description: Member statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberStats"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/issues/{period}:
    get:
      operationId: getProjectIssues
      tags: [metrics]
      summary: Get recent issues for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: ["1m", "3m", "2s", "6s"]
          description: >
            Time window. "1m"/"3m" = últimos 30/90 días (kanban, o scrum sin
            selector de sprint). "Ns" = últimos N sprints CERRADOS (solo
            scrum); si el proyecto no tiene sprints cerrados aún, cae a "3m".
      responses:
        "200":
          description: Issues list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"

  /projects/{projectId}/cfd/{period}:
    get:
      operationId: getProjectCfd
      tags: [metrics]
      summary: Get Cumulative Flow Diagram data for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PeriodPath"
      responses:
        "200":
          description: CFD data points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CfdResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects:
    get:
      operationId: listUserProjects
      tags: [projects]
      summary: List all projects with user visibility settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of projects with visibility
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithVisibility"
    put:
      operationId: updateProjectVisibility
      tags: [projects]
      summary: Batch update project visibility settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProjectVisibilityUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/forecast:
    post:
      operationId: postProjectForecast
      tags: [metrics]
      summary: Monte Carlo forecast for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastRequest"
      responses:
        "200":
          description: Forecast results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/health/{period}:
    get:
      operationId: getProjectHealth
      tags: [metrics]
      summary: Get health radar dimensions for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: ["1m", "3m", "2s", "6s"]
          description: >
            Time window. "1m"/"3m" = últimos 30/90 días (kanban, o scrum sin
            selector de sprint). "Ns" = últimos N sprints CERRADOS (solo
            scrum); si el proyecto no tiene sprints cerrados aún, cae a "3m".
      responses:
        "200":
          description: Health dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/issues/{period}/csv:
    get:
      operationId: downloadProjectIssuesCsv
      tags: [metrics]
      summary: Export issues as CSV
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PeriodPath"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /projects/{projectId}/qa-rejected/{period}:
    get:
      operationId: getProjectQaRejected
      tags: [metrics]
      summary: Get QA rejected issues for a project by period
      description: >
        Scans issue changelogs for transitions from a QA status back to a
        Dev/backlog status (e.g. "QA In Progress" → "Ready for Dev").
        Returns aggregated counts per sprint and the list of rejected issues.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PeriodPath"
      responses:
        "200":
          description: QA rejected metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaRejectedResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/kanban/{period}:
    get:
      operationId: getProjectKanbanMetrics
      tags: [metrics]
      summary: Get weekly Kanban metrics (throughput, cycle time) for non-Scrum projects
      description: >
        Groups completed issues by ISO week and computes throughput, cycle time,
        reopened count, and issue type breakdown per week. Only available for
        Kanban/simple board projects.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PeriodPath"
      responses:
        "200":
          description: Kanban weekly metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanMetricsResponse"
        "400":
          description: Project is a Scrum project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/sprints/{period}:
    get:
      operationId: getProjectSprintMetrics
      tags: [metrics]
      summary: Get sprint-level metrics (velocity, completion, cycle time) for Scrum projects
      description: >
        Returns per-sprint breakdown: velocity, completion rate, cycle time,
        reopened count, and issue type breakdown. Only available for Scrum projects.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PeriodPath"
      responses:
        "200":
          description: Sprint metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintMetricsResponse"
        "400":
          description: Project is not a Scrum project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/sprint-summary/{sprintId}:
    get:
      operationId: getProjectSprintSummary
      tags: [metrics]
      summary: Executive summary of one sprint (KPIs vs the previous sprint, per member, per issue type)
      description: >
        Rovo-style sprint report for the Resumen tab. Same scope as the Sprints table. For a closed
        sprint "completed" means already done when the sprint closed ("% real cerrado"); for one not
        closed yet, the current status. previous is the sprint that closed right before this one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sprintId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sprint summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintSummaryResponse"
        "400":
          description: Project is not a Scrum project, or invalid sprint id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or sprint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/capacity:
    get:
      operationId: getProjectCapacity
      tags: [metrics]
      summary: Capacity planning for the next or the active sprint of a Scrum project
      description: >
        Recommended commitment for a sprint in story points and issues, from the team's delivery
        rate per available person-day over the last closed sprints, plus each person's capacity vs.
        assigned work. `sprint=next` is the next future sprint, `sprint=active` the one in progress
        (real working days, progress so far and load on what is still open); absent = next future
        sprint, else the active one. Scrum projects only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sprint
          in: query
          required: false
          schema:
            type: string
            enum: [active, next]
      responses:
        "200":
          description: Capacity for the requested sprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        "400":
          description: Project is not a Scrum project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/capacity/{sprintId}:
    put:
      operationId: updateProjectCapacity
      tags: [metrics]
      summary: Save team availability for a sprint (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sprintId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CapacityMemberInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a new user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}:
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level dashboard summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /projects/{projectId}/wip:
    get:
      operationId: getProjectWip
      tags: [projects]
      summary: Work in progress now, started vs delivered per week, and sustainable WIP
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WIP snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WipResponse"
  /projects/{projectId}/freshness:
    get:
      operationId: getProjectFreshness
      tags: [projects]
      summary: When this project's Jira data was last fetched, and whether it is older than 24 h
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Data freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataFreshness"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    PeriodPath:
      name: period
      in: path
      required: true
      schema:
        type: string
        enum: ["1m", "3m"]
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    UserRole:
      type: string
      enum: [admin, member, viewer]

    User:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        createdAt:
          type: string

    AdminUser:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        createdAt:
          type: string

    AdminCreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, member, viewer]
          default: member

    AdminUpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, member, viewer]

    Project:
      type: object
      required: [id, key, name, projectType, issueCount, doneCount, inProgressCount, visible]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        projectType:
          type: string
        boardType:
          type: string
          enum: [scrum, kanban, simple]
          description: Agile board methodology detected from Jira boards
        methodology:
          type: string
          description: Human-readable methodology label (Scrum or Kanban)
        avatarUrl:
          type: ["string", "null"]
        issueCount:
          type: integer
        doneCount:
          type: integer
        inProgressCount:
          type: integer
        visible:
          type: boolean
        lead:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        usingMockData:
          type: boolean
          description: Whether the data is from Jira or demo/mock data

    ProjectWithVisibility:
      type: object
      required: [id, key, name, projectType, issueCount, doneCount, inProgressCount, visible]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        projectType:
          type: string
        boardType:
          type: string
          enum: [scrum, kanban, simple]
        methodology:
          type: string
        avatarUrl:
          type: ["string", "null"]
        issueCount:
          type: integer
        doneCount:
          type: integer
        inProgressCount:
          type: integer
        lead:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        usingMockData:
          type: boolean
        visible:
          type: boolean
          description: Whether this project is visible in the dashboard

    ProjectVisibilityUpdate:
      type: object
      required: [projectId, visible]
      properties:
        projectId:
          type: string
        visible:
          type: boolean

    ProjectMetrics:
      type: object
      required: [projectId, period, boardType, isScrum, velocity, cycleTime, leadTime, throughput, resolvedCount, velocityTrend, throughputTrend, velocityByWeek, cycleTimePercentiles, leadTimePercentiles, slowestIssues]
      properties:
        projectId:
          type: string
        period:
          type: string
        boardType:
          type: string
          enum: [scrum, kanban, simple]
          description: Agile board methodology detected from Jira boards
        isScrum:
          type: boolean
          description: Whether velocity applies (only true for Scrum projects)
        velocity:
          type: ["number", "null"]
          description: Story points completed per sprint (null for non-Scrum projects)
        cycleTime:
          type: number
          description: Average days from start to done
        leadTime:
          type: number
          description: Average days from creation to done (lead time)
        throughput:
          type: number
          description: Issues completed per week
        resolvedCount:
          type: integer
          description: Total resolved issues in period
        velocityTrend:
          type: number
          description: Percentage change vs previous period
        throughputTrend:
          type: number
          description: Percentage change vs previous period
        velocityByWeek:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyDataPoint"
        cycleTimeDistribution:
          type: array
          items:
            $ref: "#/components/schemas/CycleTimeDataPoint"
        cycleTimePercentiles:
          allOf:
            - $ref: "#/components/schemas/Percentiles"
          description: P50/P75/P85/P95 cycle time percentiles
        leadTimePercentiles:
          allOf:
            - $ref: "#/components/schemas/Percentiles"
          description: P50/P75/P85/P95 lead time percentiles
        leadTimeBuckets:
          type: array
          description: Lead time of the period's delivered issues in 6 day buckets (0-1d … 30d+)
          items:
            $ref: "#/components/schemas/CycleTimeDataPoint"
        cycleTimeBuckets:
          type: array
          description: Cycle time of the period's delivered issues in the same 6 buckets
          items:
            $ref: "#/components/schemas/CycleTimeDataPoint"
        deliveredByWeek:
          type: array
          description: Delivered issues per ISO week (label like 2026-W45, as issues-by-week uses)
          items:
            type: object
            required: [week, count]
            properties:
              week: { type: string }
              count: { type: integer }
        timeTargets:
          type: object
          description: Lead/cycle time target (project 3m target, else any project target, else the Admin good threshold); null when none.
          required: [leadTime, cycleTime]
          properties:
            leadTime: { type: number, nullable: true }
            cycleTime: { type: number, nullable: true }
        slowestIssues:
          type: array
          description: Issues resolved in the period whose lead or cycle time is above the period's P95, slowest lead time first
          items:
            $ref: "#/components/schemas/SlowIssue"

    SlowIssue:
      type: object
      required: [key, summary, issueType, assignee, created, resolvedAt, leadTimeDays, cycleTimeDays, aboveLeadP95, aboveCycleP95]
      properties:
        key:
          type: string
        summary:
          type: string
        issueType:
          type: string
          description: Jira issue type name as shown in Jira
        assignee:
          type: string
          nullable: true
        created:
          type: string
        resolvedAt:
          type: string
          nullable: true
        leadTimeDays:
          type: number
          nullable: true
        cycleTimeDays:
          type: number
          nullable: true
        aboveLeadP95:
          type: boolean
        aboveCycleP95:
          type: boolean

    WeeklyDataPoint:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          description: "Bucket label — calendar week (kanban / non-sprint window) or sprint name (scrum sprint window)"
        value:
          type: number
        medianCycleTime:
          type: number
          nullable: true
          description: "Median cycle time (days) of issues resolved in this bucket, null if none resolved"
        medianLeadTime:
          type: number
          nullable: true
          description: "Median lead time (days) of issues resolved in this bucket, null if none resolved"
        cycleTimeP85:
          type: number
          nullable: true
        cycleTimeP95:
          type: number
          nullable: true
        leadTimeP85:
          type: number
          nullable: true
        leadTimeP95:
          type: number
          nullable: true

    CycleTimeDataPoint:
      type: object
      required: [range, count]
      properties:
        range:
          type: string
        count:
          type: integer

    MemberStats:
      type: object
      required: [accountId, displayName, issuesResolved, issuesResolvedWithPoints, storyPoints, avgCycleTime, avgLeadTime, medianCycleTime, medianLeadTime, issuesInProgress, issuesBlocked]
      properties:
        accountId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        issuesResolved:
          type: integer
        issuesResolvedWithPoints:
          type: integer
          description: Of issuesResolved, how many carried a story point estimate — bugs/support work often don't, so storyPoints alone understates their contribution.
        storyPoints:
          type: number
        avgCycleTime:
          type: number
          description: Mean time from first "in progress" transition to resolution (not from creation — that's avgLeadTime).
        avgLeadTime:
          type: number
          description: Mean time from creation to resolution, including backlog wait time.
        medianCycleTime:
          type: ["number", "null"]
          description: Median cycle time (days) of the member's resolved issues — the headline value.
        medianLeadTime:
          type: ["number", "null"]
          description: Median lead time (days) of the member's resolved issues.
        issuesInProgress:
          type: integer
          description: Currently open issues assigned to this member, regardless of when they were created.
        issuesBlocked:
          type: integer
          description: Of issuesInProgress, how many are blocked right now (status or Flagged field).

    Issue:
      type: object
      required: [id, key, summary, status, issueType, priority, createdAt, isInProgress]
      properties:
        id:
          type: string
        key:
          type: string
        summary:
          type: string
        status:
          type: string
        issueType:
          type: string
        priority:
          type: string
        assignee:
          type: ["string", "null"]
        assigneeAccountId:
          type: ["string", "null"]
          description: Jira account ID — join key against MemberStats.accountId. Prefer this over the display name, which isn't guaranteed unique across an org.
        isInProgress:
          type: boolean
          description: Jira's own statusCategory === "indeterminate" — the same signal MemberStats.issuesInProgress counts against. Don't re-derive "in progress" from the status name string; category names vary a lot per project/workflow.
        storyPoints:
          type: ["number", "null"]
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        cycleTimeDays:
          type: ["number", "null"]

    CfdResponse:
      type: object
      required: [projectId, period, dataPoints]
      properties:
        projectId:
          type: string
        period:
          type: string
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/CfdDataPoint"

    CfdDataPoint:
      type: object
      required: [date, todo, inProgress, done]
      properties:
        date:
          type: string
          format: date
        todo:
          type: integer
          description: Issues in To Do / backlog state
        inProgress:
          type: integer
          description: Issues actively being worked on
        done:
          type: integer
          description: Issues completed

    DashboardSummary:
      type: object
      required: [avgCycleTime]
      properties:
        avgCycleTime:
          type: number
        usingMockData:
          type: boolean
          description: Whether the data is from Jira or demo/mock data

    Percentiles:
      type: object
      required: [p50, p75, p85, p95]
      properties:
        p50:
          type: number
          description: 50th percentile (median)
        p75:
          type: number
          description: 75th percentile
        p85:
          type: number
          description: 85th percentile
        p95:
          type: number
          description: 95th percentile

    ForecastRequest:
      type: object
      required: [target]
      properties:
        target:
          type: number
          description: Number of issues or story points to forecast
        unit:
          type: string
          enum: [issues, story_points]
          default: issues
        simulations:
          type: integer
          default: 10000
          description: Number of Monte Carlo simulations (max 50000)
        windowDays:
          type: integer
          default: 180
          description: Historical lookback window in days (30, 90, or 180)

    ForecastResponse:
      type: object
      required: [target, unit, simulations, probability, medianWeeks, p75Weeks, p85Weeks, p95Weeks, histogram]
      properties:
        target:
          type: number
        unit:
          type: string
          enum: [issues, story_points]
        simulations:
          type: integer
        probability:
          type: number
          description: Probability of hitting target (0-100%)
        medianWeeks:
          type: number
        p75Weeks:
          type: number
        p85Weeks:
          type: number
        p95Weeks:
          type: number
        histogram:
          type: array
          items:
            $ref: "#/components/schemas/ForecastHistogramBin"

    ForecastHistogramBin:
      type: object
      required: [week, count]
      properties:
        week:
          type: integer
        count:
          type: integer
          description: Percentage of simulations

    HealthResponse:
      type: object
      required: [projectId, period, dimensions]
      properties:
        projectId:
          type: string
        period:
          type: string
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/HealthDimension"

    HealthDimension:
      type: object
      required: [name, value, description]
      properties:
        name:
          type: string
        value:
          type: integer
          description: Normalized score 0-100
        description:
          type: string

    QaRejectedResponse:
      type: object
      required:
        - projectId
        - period
        - qaStatuses
        - devReturnStatuses
        - totalRejectedReversions
        - totalIssuesRejected
        - totalIssuesThatEnteredQa
        - overallRejectionRate
        - totalLinkedBugs
        - totalStandaloneBugs
        - overallBugRate
        - overallQaImpactRate
        - bySprint
        - byWeek
        - rejectedIssues
        - linkedBugs
      properties:
        projectId:
          type: string
        period:
          type: string
        qaStatuses:
          type: array
          items:
            type: string
          description: Auto-detected QA status names
        devReturnStatuses:
          type: array
          items:
            type: string
          description: Auto-detected Dev/backlog status names (not QA, not Done)
        totalRejectedReversions:
          type: integer
          description: Total QA→Dev transitions across all issues
        totalIssuesRejected:
          type: integer
          description: Unique issues with at least one QA rejection
        totalIssuesThatEnteredQa:
          type: integer
          description: Unique issues that ever entered a QA status
        overallRejectionRate:
          type: number
          description: Percentage of issues rejected by QA out of those that entered QA
        totalLinkedBugs:
          type: integer
          description: Bugs linked to stories via issuelinks
        totalStandaloneBugs:
          type: integer
          description: Bug issues not linked to any story
        overallBugRate:
          type: number
          description: Bugs per issue that entered QA
        overallQaImpactRate:
          type: number
          description: Combined rejection + bug impact rate
        byWeek:
          type: array
          description: QA rejection rate per ISO week (distinct issues rejected / distinct issues that entered QA), covers Kanban
          items:
            type: object
            required: [weekStart, totalEnteredQa, rejectedCount, rate]
            properties:
              weekStart: { type: string }
              totalEnteredQa: { type: integer }
              rejectedCount: { type: integer }
              rate: { type: number, nullable: true, description: Null when nothing entered QA that week. }
        bySprint:
          type: array
          items:
            $ref: "#/components/schemas/RejectedBySprint"
        rejectedIssues:
          type: array
          items:
            $ref: "#/components/schemas/RejectedIssue"
        linkedBugs:
          type: array
          items:
            $ref: "#/components/schemas/LinkedBug"

    RejectedBySprint:
      type: object
      required: [sprintName, rejectedCount, totalEnteredQa, rate, bugsCount, bugRate, qaImpactRate]
      properties:
        sprintName:
          type: string
        rejectedCount:
          type: integer
          description: QA→Dev reversions in this sprint
        totalEnteredQa:
          type: integer
          description: Times issues entered QA in this sprint
        rate:
          type: number
          description: Rejection rate percentage
        bugsCount:
          type: integer
          description: Linked bugs created during this sprint
        bugRate:
          type: number
          description: Bugs per issue that entered QA
        qaImpactRate:
          type: number
          description: Combined rejection + bug impact rate

    RejectedIssue:
      type: object
      required: [key, summary, issueType, fromStatus, toStatus, transitionedAt]
      properties:
        key:
          type: string
        summary:
          type: string
        issueType:
          type: string
        fromStatus:
          type: string
        toStatus:
          type: string
        transitionedAt:
          type: string
          format: date-time
        sprintName:
          type: ["string", "null"]

    LinkedBug:
      type: object
      required: [bugKey, bugSummary, bugStatus, bugCreated, parentStoryKey, parentStorySummary, parentStoryRejected]
      properties:
        bugKey:
          type: string
        bugSummary:
          type: string
        bugStatus:
          type: string
        bugCreated:
          type: string
          format: date-time
        parentStoryKey:
          type: string
        parentStorySummary:
          type: string
        parentStoryRejected:
          type: boolean
          description: Whether the parent story was rejected by QA

    SprintSummaryKpis:
      type: object
      required: [sprintId, sprintName, state, startDate, endDate, closeDate, committedStoryPoints,
        deliveredStoryPoints, completionRate, completionBasis, totalIssues, completedIssues,
        issueCompletionRate, incompleteIssues, incompleteStoryPoints, bugsTotal, bugsCompleted,
        unestimatedIssues, doneTodayStoryPoints, doneTodayIssues, doneTodayRate]
      properties:
        sprintId:
          type: integer
        sprintName:
          type: string
        state:
          type: string
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        closeDate:
          type: string
          nullable: true
        committedStoryPoints:
          type: number
        deliveredStoryPoints:
          type: number
        completionRate:
          type: number
        completionBasis:
          type: string
          enum: [storyPoints, issueCount]
        totalIssues:
          type: integer
        completedIssues:
          type: integer
        issueCompletionRate:
          type: number
        incompleteIssues:
          type: integer
        incompleteStoryPoints:
          type: number
        bugsTotal:
          type: integer
        bugsCompleted:
          type: integer
        unestimatedIssues:
          type: integer
        doneTodayStoryPoints:
          type: number
          description: Done hoy (current status, Rovo's number), same scope as committedStoryPoints.
        doneTodayIssues:
          type: integer
        doneTodayRate:
          type: number
          description: Done hoy rate on the same basis as completionRate (story points, or issue count).
    SprintSummaryMember:
      type: object
      required: [accountId, name, totalIssues, completedIssues, totalStoryPoints, completedStoryPoints, incompleteStoryPoints, completionRate, unestimatedIssues, incompleteKeys]
      properties:
        accountId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Current assignee; null = unassigned.
        totalIssues:
          type: integer
        completedIssues:
          type: integer
        totalStoryPoints:
          type: number
        completedStoryPoints:
          type: number
        incompleteStoryPoints:
          type: number
        completionRate:
          type: number
          nullable: true
          description: Story-point basis; null when the group has no story points.
        unestimatedIssues:
          type: integer
        incompleteKeys:
          type: array
          items:
            type: string
    SprintSummaryType:
      type: object
      required: [type, totalIssues, completedIssues, totalStoryPoints, completedStoryPoints, incompleteStoryPoints, completionRate, unestimatedIssues, incompleteKeys]
      properties:
        type:
          type: string
          description: Jira's own issue type name.
        totalIssues:
          type: integer
        completedIssues:
          type: integer
        totalStoryPoints:
          type: number
        completedStoryPoints:
          type: number
        incompleteStoryPoints:
          type: number
        completionRate:
          type: number
          nullable: true
          description: Story-point basis; null when the group has no story points.
        unestimatedIssues:
          type: integer
        incompleteKeys:
          type: array
          items:
            type: string
    SprintSummaryResponse:
      type: object
      required: [kpis, members, types, previous]
      properties:
        kpis:
          $ref: "#/components/schemas/SprintSummaryKpis"
        members:
          type: array
          items:
            $ref: "#/components/schemas/SprintSummaryMember"
        types:
          type: array
          items:
            $ref: "#/components/schemas/SprintSummaryType"
        previous:
          allOf:
            - $ref: "#/components/schemas/SprintSummaryKpis"
          nullable: true
    SprintMetricsResponse:
      type: object
      required: [sprints, summary]
      properties:
        sprints:
          type: array
          items:
            $ref: "#/components/schemas/SprintMetric"
        summary:
          $ref: "#/components/schemas/SprintMetricsSummary"

    CapacityUnits:
      type: object
      required: [sp, issues]
      properties:
        sp: { type: number }
        issues: { type: number }

    CapacityRange:
      type: object
      required: [sp, issues]
      properties:
        sp:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
        issues:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2

    CapacityRateBand:
      type: object
      required: [p25, p50, p75]
      properties:
        p25: { type: number }
        p50: { type: number }
        p75: { type: number }

    CapacityAbsence:
      type: object
      required: [date, portion, type, note]
      properties:
        date: { type: string, description: "YYYY-MM-DD, a working day of the sprint" }
        portion: { type: string, enum: [full, am, pm] }
        type: { type: string, enum: [vacation, sick, personal, training, holiday, other] }
        note: { type: string, nullable: true, maxLength: 200 }

    CapacityMemberInput:
      type: object
      required: [accountId, displayName, absenceDays, dedicationPct, counts, manual, recent, absences, departed, role]
      properties:
        accountId: { type: string }
        displayName: { type: string }
        absenceDays:
          type: number
          minimum: 0
          maximum: 10
          description: With dated absences the server sets it to their total (full day 1, morning/afternoon 0.5).
        absences:
          type: array
          items: { $ref: "#/components/schemas/CapacityAbsence" }
        dedicationPct: { type: integer, minimum: 0, maximum: 100 }
        counts:
          type: boolean
          description: Counts for capacity in this project (persistent, all sprints). Only devs do.
        manual:
          type: boolean
          description: Added by hand (no Jira issues yet); omitted manual people are removed.
        role:
          type: string
          enum: [dev, lt, qa, po, sm, other]
          description: >
            Team role (persistent, per project). Decides counts (dev and lt count) and the default
            dedication when nothing was saved for the sprint (lt 50%, others 100%).
        departed:
          type: boolean
          description: >
            Left the team (persistent, per project). Not part of the current/next sprint's team and
            adds no availability, but stays in the closed sprints' history and team rate.
        recent:
          type: boolean
          description: >
            Part of the sprint's team. false = only seen in older sprints: listed so an admin
            can mark whether they count for the historical rate, but adds no availability.

    CapacityTeamRow:
      allOf:
        - $ref: "#/components/schemas/CapacityMemberInput"
        - type: object
          required: [availableDays, capacity, assigned, done, loadPct, band]
          properties:
            availableDays: { type: number }
            capacity:
              allOf:
                - $ref: "#/components/schemas/CapacityUnits"
              description: Active sprint = capacity over the days still left.
            assigned: { $ref: "#/components/schemas/CapacityUnits" }
            done: { $ref: "#/components/schemas/CapacityUnits" }
            loadPct: { type: number, nullable: true }
            band: { type: string, enum: [ok, warn, over] }

    CapacityHistoryRow:
      type: object
      required: [sprintId, sprintName, committed, completed, completionPct]
      properties:
        sprintId: { type: string }
        sprintName: { type: string }
        committed: { $ref: "#/components/schemas/CapacityUnits" }
        completed: { $ref: "#/components/schemas/CapacityUnits" }
        completionPct: { type: number }

    DataFreshness:
      type: object
      required: [fetchedAt, stale]
      properties:
        fetchedAt: { type: string, nullable: true, description: Latest fetch from Jira of this project's issues; null if never cached. }
        stale: { type: boolean, description: Older than 24 h. }

    WipItem:
      type: object
      required: [key, summary, assignee, issueType, status, active, blocked, startedAt, ageDays]
      properties:
        key: { type: string }
        summary: { type: string }
        assignee: { type: string, nullable: true }
        issueType: { type: string }
        status: { type: string }
        active: { type: boolean, description: In an in-progress status (false = waiting mid-flow, e.g. Ready for QA). }
        blocked: { type: boolean, description: Blocked right now (status or Flagged field). }
        startedAt: { type: string, description: Start of the current stretch of work (same rule as cycle time). }
        ageDays: { type: number }

    WipStatusRow:
      type: object
      required: [status, active, count, oldestDays]
      properties:
        status: { type: string }
        active: { type: boolean }
        count: { type: integer }
        oldestDays: { type: number }

    WipFlowWeek:
      type: object
      required: [weekStart, started, delivered]
      properties:
        weekStart: { type: string }
        started: { type: integer }
        delivered: { type: integer }

    WipResponse:
      type: object
      required: [total, blockedNow, items, byStatus, weeks, sustainableWip, meanCycleTimeDays]
      properties:
        total: { type: integer }
        blockedNow: { type: integer, description: Items in progress that are blocked right now (subset of total). }
        items:
          type: array
          items: { $ref: "#/components/schemas/WipItem" }
        byStatus:
          type: array
          items: { $ref: "#/components/schemas/WipStatusRow" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/WipFlowWeek" }
        sustainableWip:
          type: number
          nullable: true
          description: Little's law, throughput per day × mean cycle time over the full weeks of the window.
        meanCycleTimeDays:
          type: number
          nullable: true

    CapacityTeamSummary:
      type: object
      required: [people, byRole, effectiveDevs, historyEffectiveDevs, departedWithWork]
      properties:
        people: { type: integer, description: People in this sprint's team (not departed). }
        byRole:
          type: object
          required: [dev, lt, qa, po, sm, other]
          properties:
            dev: { type: integer }
            lt: { type: integer }
            qa: { type: integer }
            po: { type: integer }
            sm: { type: integer }
            other: { type: integer }
        effectiveDevs:
          type: number
          description: Available person-days ÷ sprint working days (full-time devs the team amounts to).
        historyEffectiveDevs:
          type: number
          nullable: true
          description: Same, averaged over the closed sprints behind the team rate.
        departedWithWork:
          type: array
          items:
            type: object
            required: [displayName, sp, issues]
            properties:
              displayName: { type: string }
              sp: { type: number }
              issues: { type: integer }

    CapacityResponse:
      type: object
      required: [sprint, recommendation, committed, progress, rate, team, unassigned, teamSummary, history, warnings]
      properties:
        sprint:
          type: object
          nullable: true
          required: [id, name, state, startDate, endDate, workingDays, days]
          properties:
            id: { type: string }
            name: { type: string }
            state: { type: string, enum: [active, future] }
            startDate: { type: string, nullable: true }
            endDate: { type: string, nullable: true }
            workingDays: { type: integer }
            days:
              type: array
              description: >
                Working dates (YYYY-MM-DD) for placing absences. Without dates in Jira, 10 working
                days from the Monday after the active sprint ends.
              items: { type: string }
        recommendation:
          type: object
          nullable: true
          required: [range, availabilityPct, availablePersonDays, band]
          properties:
            range: { $ref: "#/components/schemas/CapacityRange" }
            availabilityPct: { type: number }
            availablePersonDays: { type: number }
            band:
              type: object
              required: [sp, issues]
              properties:
                sp: { type: string, enum: [ok, warn, over] }
                issues: { type: string, enum: [ok, warn, over] }
        committed:
          type: object
          required: [sp, issues, unestimated]
          properties:
            sp: { type: number }
            issues: { type: number }
            unestimated: { type: integer }
        progress:
          type: object
          nullable: true
          description: Only for the active sprint.
          required: [elapsedDays, remainingDays, done, remaining, expected, pace]
          properties:
            elapsedDays: { type: integer }
            remainingDays: { type: integer }
            done: { $ref: "#/components/schemas/CapacityUnits" }
            remaining: { $ref: "#/components/schemas/CapacityUnits" }
            expected:
              allOf:
                - $ref: "#/components/schemas/CapacityRange"
              nullable: true
              description: Recommended range prorated to the elapsed share of the sprint.
            pace:
              type: object
              nullable: true
              required: [sp, issues]
              properties:
                sp: { type: string, enum: [ok, warn, over] }
                issues: { type: string, enum: [ok, warn, over] }
        rate:
          type: object
          nullable: true
          required: [sp, issues, sprintsUsed]
          properties:
            sp: { $ref: "#/components/schemas/CapacityRateBand" }
            issues: { $ref: "#/components/schemas/CapacityRateBand" }
            sprintsUsed: { type: integer }
        team:
          type: array
          items: { $ref: "#/components/schemas/CapacityTeamRow" }
        unassigned: { $ref: "#/components/schemas/CapacityUnits" }
        teamSummary: { $ref: "#/components/schemas/CapacityTeamSummary" }
        history:
          type: array
          items: { $ref: "#/components/schemas/CapacityHistoryRow" }
        warnings:
          type: array
          items: { type: string }

    SprintMetric:
      type: object
      required:
        [sprintId, sprintName, state, startDate, endDate, totalIssues, totalStoryPoints,
         completedIssues, completedStoryPoints, completionRate, completionBasis, velocity,
         reopenedCount, avgCycleTimeDays, medianCycleTimeDays, breakdown, carryoverCount, carryoverStoryPoints,
         carryoverRate, addedAfterPlanningCount, addedAfterPlanningStoryPoints, addedAfterPlanningKeys,
         closedAtSprintEndIssues, closedAtSprintEndStoryPoints, closedAtSprintEndRate]
      properties:
        sprintId:
          type: integer
        sprintName:
          type: string
        state:
          type: string
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        totalIssues:
          type: integer
        totalStoryPoints:
          type: number
        completedIssues:
          type: integer
        completedStoryPoints:
          type: number
        completionRate:
          type: number
          description: Percentage of issues completed (0-100)
        completionBasis:
          type: string
          enum: [storyPoints, issueCount]
          description: Which base completionRate was computed on — falls back to issue count when the sprint has no story points logged. Two sprints' rates aren't comparable unless the basis matches.
        velocity:
          type: number
          description: Story points completed in this sprint
        reopenedCount:
          type: integer
          description: Number of issues reopened after being marked done
        avgCycleTimeDays:
          type: ["number", "null"]
        medianCycleTimeDays:
          type: ["number", "null"]
          description: Median cycle time of the issues delivered in this sprint's window (same as Métricas)
        breakdown:
          $ref: "#/components/schemas/IssueTypeBreakdown"
        carryoverCount:
          type: integer
          description: Number of issues in this sprint that were already assigned to an earlier sprint (per Jira's Sprint field history) whose end date precedes this sprint's start date — work that slipped from a previous sprint into this one.
        carryoverStoryPoints:
          type: number
          description: Story points belonging to carryoverCount issues.
        carryoverRate:
          type: number
          description: Percentage of this sprint's total story points that is carryover (0-100).
        addedAfterPlanningCount:
          type: integer
          description: Issues that entered this sprint after its planning (end of the sprint's first day, team timezone), per Jira's Sprint field history or the creation date when created straight into the sprint. A removal and later re-add counts from the re-add.
        addedAfterPlanningStoryPoints:
          type: number
          description: Story points belonging to addedAfterPlanningCount issues.
        addedAfterPlanningKeys:
          type: array
          items:
            type: string
          description: Keys of the addedAfterPlanningCount issues.
        closedAtSprintEndIssues:
          type: integer
          nullable: true
          description: Issues already done when the sprint closed (from the changelog). Null while the sprint is not closed. completedIssues is the current status instead (cumulative).
        closedAtSprintEndStoryPoints:
          type: number
          nullable: true
          description: Story points of closedAtSprintEndIssues. Null while the sprint is not closed.
        closedAtSprintEndRate:
          type: number
          nullable: true
          description: "\"% real cerrado\": closedAtSprintEnd over the sprint's scope, on the same completionBasis as completionRate. Null while the sprint is not closed."
        goal:
          type: ["string", "null"]
          description: This sprint's goal, as set in Jira. Null when the sprint has no goal or it's blank.

    IssueTypeBreakdown:
      type: object
      required: [Story, Bug, Task, Epic, Other]
      properties:
        Story:
          type: integer
        Bug:
          type: integer
        Task:
          type: integer
        Epic:
          type: integer
        Other:
          type: integer

    SprintMetricsSummary:
      type: object
      required: [totalSprints, avgVelocity, avgCompletionRate, avgCycleTimeDays, medianCycleTimeDays, totalCompletedStoryPoints, totalSprintsInPeriod]
      properties:
        totalSprints:
          type: integer
          description: Closed sprints the averages below are computed from. An active sprint (if any) is included in the top-level `sprints` array but excluded here — it's still in progress, so folding its partial numbers into these averages would misrepresent them as a decline.
        avgVelocity:
          type: number
        avgCompletionRate:
          type: number
        avgCycleTimeDays:
          type: ["number", "null"]
        medianCycleTimeDays:
          type: ["number", "null"]
          description: Median cycle time over every issue delivered inside the closed sprints of the window
        totalCompletedStoryPoints:
          type: number
        totalSprintsInPeriod:
          type: integer
          description: How many sprints actually fall within the selected period, before capping to the display limit. Higher than `sprints.length` means older sprints were cut off.

    KanbanMetricsResponse:
      type: object
      required: [weeks, summary]
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeekMetric"
        summary:
          $ref: "#/components/schemas/KanbanMetricsSummary"

    WeekMetric:
      type: object
      required:
        [weekStart, weekLabel, totalIssues, totalStoryPoints, avgCycleTimeDays, medianCycleTimeDays,
         reopenedCount, breakdown]
      properties:
        weekStart:
          type: string
          format: date
          description: ISO date of the Monday of this week
        weekLabel:
          type: string
          description: Human-readable label like "Mar 2 - Mar 8"
        totalIssues:
          type: integer
          description: Issues completed this week (throughput)
        totalStoryPoints:
          type: number
        avgCycleTimeDays:
          type: ["number", "null"]
        medianCycleTimeDays:
          type: ["number", "null"]
        reopenedCount:
          type: integer
        breakdown:
          $ref: "#/components/schemas/IssueTypeBreakdown"

    KanbanMetricsSummary:
      type: object
      required:
        [totalWeeks, avgThroughput, avgCycleTimeDays, medianCycleTimeDays, totalCompletedIssues, totalCompletedStoryPoints]
      properties:
        totalWeeks:
          type: integer
        avgThroughput:
          type: number
        avgCycleTimeDays:
          type: ["number", "null"]
        medianCycleTimeDays:
          type: ["number", "null"]
        totalCompletedIssues:
          type: integer
        totalCompletedStoryPoints:
          type: number
