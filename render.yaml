# Render Blueprint for the backend (Express API). Deploys the Docker image built
# from docker/api/Dockerfile. Frontend goes to Vercel separately (see vercel.json
# + DEPLOY.md); Postgres is external (Neon).
#
# Secrets marked `sync: false` are NOT stored here — set them in the Render
# dashboard (Environment tab) after the service is created. JWT_SECRET is
# generated by Render itself (secure random), satisfying the SEC-1 requirement.
services:
  - type: web
    name: agile-metric-hub-api
    runtime: docker
    repo: https://github.com/andresga79/agile-metric-hub
    branch: main
    dockerfilePath: ./docker/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon # match Neon's region for lower latency
    healthCheckPath: /api/healthz
    # Render injects PORT automatically; index.ts reads it. Do not hardcode it.
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value
      - key: CORS_ORIGIN
        value: https://agile-metric-hub.vercel.app
      - key: DATABASE_URL
        sync: false # Neon connection string (include ?sslmode=require)
      - key: JIRA_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false # strong password; >=8 chars, not "admin123"
